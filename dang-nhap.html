<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống - Quản lý kho StockFlow</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-gradient-to-tr from-purple-700 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto shadow-lg shadow-purple-200">
        📦
      </div>
      <h1 class="text-2xl font-bold text-slate-800">STOCKFLOW</h1>
      <p class="text-xs font-semibold text-purple-600 tracking-wider uppercase">HỆ THỐNG QUẢN LÝ KHO VẬN ĐA KHO</p>
      <p class="text-xs text-slate-500 pt-1">Đăng nhập tài khoản để vào hệ thống quản trị</p>
    </div>

    <!-- Form Đăng nhập mẫu -->
    <form id="form-dang-nhap" onsubmit="xuLyDangNhap(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email người dùng</label>
        <input type="email" id="input-email" required value="an.nguyen@khohang.vn" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mật khẩu</label>
        <input type="password" id="input-mat-khau" required value="123456" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600">
      </div>

      <button type="submit" class="w-full py-3 px-4 bg-purple-700 hover:bg-purple-800 text-white text-sm font-bold rounded-xl shadow-md shadow-purple-200 transition">
        🚀 Đăng nhập vào hệ thống
      </button>
    </form>

    <!-- Chọn vai trò Demo nhanh (Hỗ trợ chấm bài tập / Demo đồ án) -->
    <div class="pt-4 border-t border-slate-200">
      <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 text-center">Hoặc chọn nhanh tài khoản Demo (RBAC):</p>
      <div class="space-y-2">
        <button onclick="chonTaiKhoanNhanh('u1')" class="w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:border-purple-300 hover:bg-purple-50 transition text-left">
          <div>
            <p class="text-xs font-bold text-slate-800">1. Nguyễn Văn An</p>
            <p class="text-[11px] text-slate-500">Giám Đốc Kho Vận</p>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-rose-100 text-rose-700">Admin</span>
        </button>

        <button onclick="chonTaiKhoanNhanh('u2')" class="w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:border-purple-300 hover:bg-purple-50 transition text-left">
          <div>
            <p class="text-xs font-bold text-slate-800">2. Trần Thị Mai</p>
            <p class="text-[11px] text-slate-500">Quản lý Điều phối kho</p>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-purple-100 text-purple-700">Manager</span>
        </button>

        <button onclick="chonTaiKhoanNhanh('u3')" class="w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:border-purple-300 hover:bg-purple-50 transition text-left">
          <div>
            <p class="text-xs font-bold text-slate-800">3. Lê Hoàng Nam</p>
            <p class="text-[11px] text-slate-500">Thủ kho Kho Tổng HN</p>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-100 text-blue-700">Staff</span>
        </button>

        <button onclick="chonTaiKhoanNhanh('u4')" class="w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:border-purple-300 hover:bg-purple-50 transition text-left">
          <div>
            <p class="text-xs font-bold text-slate-800">4. Phạm Thu Trang</p>
            <p class="text-[11px] text-slate-500">Kế toán Kiểm soát kho</p>
          </div>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700">Accountant</span>
        </button>
      </div>
    </div>

    <div class="text-center">
      <a href="index.html" class="text-xs text-purple-600 hover:underline font-semibold">
        &larr; Đi thẳng vào Trang Tổng quan (Bỏ qua đăng nhập)
      </a>
    </div>
  </div>

  <script src="store.js"></script>
  <script src="api-service.js"></script>
  <script>
    function chonTaiKhoanNhanh(id) {
      const danhSach = StockStore.getNhanSu();
      const user = danhSach.find(u => u.id === id);
      if (user) {
        StockStore.setCurrentUser({
          id: user.id,
          ten: user.ten,
          email: user.email,
          vaiTro: user.vaiTro,
          chucDanh: user.phongBan
        });
        StockStore.ghiNhatKy('ĐĂNG NHẬP', 'Hệ thống', `Người dùng ${user.ten} (${user.vaiTro}) đăng nhập vào phiên`);
        window.location.href = 'index.html';
      }
    }

    function xuLyDangNhap(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const danhSach = StockStore.getNhanSu();
      const user = danhSach.find(u => u.email.toLowerCase() === email.toLowerCase());

      if (user) {
        StockStore.setCurrentUser({
          id: user.id,
          ten: user.ten,
          email: user.email,
          vaiTro: user.vaiTro,
          chucDanh: user.phongBan
        });
        StockStore.ghiNhatKy('ĐĂNG NHẬP', 'Hệ thống', `Đăng nhập thành công với email: ${email}`);
        window.location.href = 'index.html';
      } else {
        alert('Tài khoản không tồn tại! Vui lòng chọn một tài khoản Demo phía dưới.');
      }
    }
  </script>
</body>
</html>
