<!doctype html>
<html lang="vi">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHandler = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHandler;
            },
            set: function(val) {
              fetchHandler = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.startsWith('chrome-extension://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow - Quản Lý Kho Vận Đa Chi Nhánh</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="description" content="Hệ thống quản lý kho vận đa chi nhánh và xuất nhập tồn kho" />
    <meta property="og:title" content="StockFlow" />
    <meta property="og:description" content="Hệ thống quản lý kho vận đa chi nhánh và xuất nhập tồn kho" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
